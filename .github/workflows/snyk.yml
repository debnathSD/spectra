name: Snyk

# Snyk's test of the dependencies Spectra installs, with the results in the
# repository's Security tab (code scanning). It needs a SNYK_TOKEN repository
# secret; without one it passes with a note. It runs only when dependencies
# change, every Monday and on demand, which keeps it well inside the free
# plan's monthly tests. Snyk's GitHub integration (the repository imported on
# snyk.io) monitors main and checks pull requests on its own.

on:
  push:
    branches: [main]
    paths: [package.json, vscode/package.json, .github/workflows/snyk.yml]
  pull_request:
    paths: [package.json, vscode/package.json, .github/workflows/snyk.yml]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Snyk is not set up
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::notice title=Snyk skipped::Add a SNYK_TOKEN repository secret to scan with Snyk (DOCS.md, Project health)."
          echo "Snyk skipped: the repository has no SNYK_TOKEN secret yet." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.SNYK_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 22
      - if: env.SNYK_TOKEN != ''
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Snyk test
        id: test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: npx --yes snyk@latest test --severity-threshold=high --sarif-file-output=snyk.sarif
      - name: Results to the Security tab
        if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk
      - name: High or critical vulnerabilities found
        if: steps.test.outcome == 'failure'
        run: exit 1
