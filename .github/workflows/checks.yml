name: Checks

# Everything a change to Spectra must pass: on every pull request, on main
# (where the results drive the README's badges), and weekly, so new security
# advisories show up for unchanged code.
#
# Each job leaves a short Markdown note in ci-notes/ (not a hidden folder: the
# artifact upload skips those). On a pull request the
# "PR report" job gathers them into one report, and spectra-bot posts it as a
# single comment that is updated on every push (pr-comment.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # the release workflow runs every check before it publishes
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPORT: ${{ github.workspace }}/ci-notes

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$REPORT"
          code=0
          npx eslint . --max-warnings=0 -f json -o eslint.json || code=$?
          node scripts/ci/lint-note.mjs eslint.json --note "$REPORT/lint.md"
          cat "$REPORT/lint.md"
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-lint
          path: ci-notes/
          if-no-files-found: ignore

  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest and the newest supported Node on Linux, the one between on macOS
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 26, coverage: true }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: npm test
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$REPORT"
          set +e
          # one run also measures coverage, with minimums (package.json, test:coverage)
          if [ "${{ matrix.coverage }}" = true ]; then npm run test:coverage > test.txt 2>&1; else npm test > test.txt 2>&1; fi
          code=$?
          cat test.txt
          node scripts/ci/test-note.mjs test.txt "Node ${{ matrix.node }}, ${{ matrix.os }}" --note "$REPORT/test-${{ matrix.os }}-${{ matrix.node }}.md"
          exit $code
      - name: VS Code extension tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm --prefix vscode test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-test-${{ matrix.os }}-${{ matrix.node }}
          path: ci-notes/
          if-no-files-found: ignore

  package:
    name: Package (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with the oldest supported Node, and Windows (paths, command shims); macOS runs the tests
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: package.json and the published files (publint)
        if: matrix.os == 'ubuntu-latest'
        run: npx publint --strict
      - name: Install the packed package in a new project, and run it
        run: |
          mkdir -p "$REPORT"
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          app="$RUNNER_TEMP/app" && mkdir -p "$app" && cd "$app"
          echo '{"name":"smoke","private":true}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/progen-labs-spectra-*.tgz
          version=$(npx spectra --version)
          test "$version" = "$(node -p "require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version")"
          npx spectra --help > /dev/null
          npx spectra agents --print | head -1 | grep -q Spectra
          npx spectra reports > /dev/null
          echo "Installs and runs on Node ${{ matrix.node }}, ${{ matrix.os }} (spectra $version)." > "$REPORT/package-${{ matrix.os }}.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-package-${{ matrix.os }}
          path: ci-notes/
          if-no-files-found: ignore

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # on a pull request, only when Markdown changed; on main and weekly, always (links die on their own)
      - name: Is a check needed?
        id: when
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$REPORT"
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only "$BASE" HEAD | grep -q '\.md$'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not checked: no Markdown changed." > "$REPORT/links.md"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Every link in the docs
        id: lychee
        if: steps.when.outputs.run == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress README.md DOCS.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md agents/*.md vscode/README.md plugins/spectra/README.md
          output: lychee.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Note
        if: always() && steps.when.outputs.run == 'true'
        run: |
          if [ "${{ steps.lychee.outcome }}" = success ]; then echo "Every link in the docs works." > "$REPORT/links.md";
          else { echo "Broken links in the docs:"; echo; grep -E '^\* |\[ERROR\]|\[404\]|\[[0-9]{3}\]' lychee.md | head -30; } > "$REPORT/links.md"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-links
          path: ci-notes/
          if-no-files-found: ignore

  size:
    name: Size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: The base branch, to compare with
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          cd "$RUNNER_TEMP/base"
          npm ci --no-audit --no-fund
          npm run build
          node "$GITHUB_WORKSPACE/scripts/size-report.mjs" --root "$RUNNER_TEMP/base" --json "$RUNNER_TEMP/base-size.json"
      - name: Sizes against their budgets
        run: |
          mkdir -p "$REPORT"
          node scripts/size-report.mjs --compare "$RUNNER_TEMP/base-size.json" --markdown "$REPORT/size.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-size
          path: ci-notes/
          if-no-files-found: ignore

  # main and weekly: advisories can appear for code that didn't change. On pull requests,
  # Dependency review checks what the change adds (npm audit would fail it for older problems).
  audit:
    name: npm audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: The dependencies users install
        run: |
          mkdir -p "$REPORT"
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const v = a.metadata?.vulnerabilities || {};
            const line = ["critical", "high", "moderate", "low"].map(s => `${s}: ${v[s] ?? 0}`).join(" · ");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### npm audit, runtime dependencies\n\n${line}\n`);
            fs.writeFileSync(process.env.REPORT + "/audit.md", `Runtime dependencies: ${line}\n`);
            console.log(line);
          '
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-audit
          path: ci-notes/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: New or changed dependencies
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          # permissive licenses only (MPL-2.0's copyleft covers only changed MPL files)
          allow-licenses: MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, MPL-2.0, Python-2.0, CC-BY-4.0, CC0-1.0, Unlicense, BlueOak-1.0.0, Zlib
      - name: Note
        if: always()
        env:
          RESULT: ${{ steps.review.outcome }}
          VULNERABLE: ${{ steps.review.outputs.vulnerable-changes }}
          LICENSES: ${{ steps.review.outputs.invalid-license-changes }}
          DENIED: ${{ steps.review.outputs.denied-changes }}
        run: |
          mkdir -p "$REPORT"
          node scripts/ci/review-note.mjs | tee "$REPORT/dependency-review.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-dependency-review
          path: ci-notes/
          if-no-files-found: ignore

  # main, weekly and on demand; Snyk's GitHub integration checks pull requests itself
  snyk:
    name: Snyk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Snyk's free plan has a monthly test budget: test when dependencies change, weekly and on demand
      - name: Is a test needed?
        id: when
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
        run: |
          mkdir -p "$REPORT"
          if [ -z "$SNYK_TOKEN" ]; then reason="the repository has no SNYK_TOKEN secret";
          elif [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then reason="";
          elif git diff --name-only "$BASE" HEAD 2>/dev/null | grep -qE '(^|/)package\.json$'; then reason="";
          else reason="no dependency changes"; fi
          if [ -n "$reason" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not tested: $reason." | tee "$REPORT/snyk.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.when.outputs.run == 'true'
        with:
          node-version: 24
      - if: steps.when.outputs.run == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts
      # every severity is reported (and shown in the Security tab); only high or critical fail the run
      - name: Snyk test
        id: test
        if: steps.when.outputs.run == 'true'
        continue-on-error: true
        run: npx --yes snyk@1.1308.2 test --sarif-file-output=snyk.sarif --json-file-output=snyk.json
      - name: Results to the Security tab
        if: steps.when.outputs.run == 'true' && hashFiles('snyk.sarif') != '' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: snyk.sarif
          category: snyk
      - name: Summary, failing on high or critical
        if: steps.when.outputs.run == 'true' && hashFiles('snyk.json') != ''
        run: node scripts/snyk-summary.mjs snyk.json --markdown "$REPORT/snyk.md"
      - name: Snyk could not run
        if: steps.when.outputs.run == 'true' && steps.test.outcome == 'failure' && hashFiles('snyk.json') == ''
        run: |
          echo "Snyk could not run: check the SNYK_TOKEN secret." > "$REPORT/snyk.md"
          echo "::error title=Snyk could not run::Check the SNYK_TOKEN secret and the log of the Snyk test step."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-snyk
          path: ci-notes/
          if-no-files-found: ignore

  bench:
    name: Fix harness bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERF_CHROME_ARGS: --no-sandbox
      SPECTRA_BENCH_MD: ${{ github.workspace }}/ci-notes/bench.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: spectra fix decides every case correctly
        run: |
          mkdir -p "$REPORT"
          node bench/run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-bench
          path: ci-notes/
          if-no-files-found: ignore

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Start the demo app
        run: |
          npm run demo > demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5188/ > /dev/null && exit 0; sleep 1; done
          cat demo.log; exit 1
      - name: Spectra (this repository's action)
        id: spectra
        uses: ./
        with:
          url: http://localhost:5188/
          cli: bin/spectra.js
          runs: '2'
          fail-on-budget: 'false'
          artifact-name: spectra-demo-reports
      - name: The deliberate problems are found
        run: |
          mkdir -p "$REPORT"
          node -e '
            const r = require(process.argv[1]);
            const titles = r.findings.map(f => f.title);
            console.log(r.summary);
            if (!titles.some(t => /Row is slow to render/.test(t))) throw new Error("missing the Row finding: " + titles);
            require("fs").writeFileSync(process.env.REPORT + "/action.md",
              `Profiled the demo app: ${r.findings.length} findings, total blocking time ${Math.round(r.summary.tbtMs ?? 0)} ms; the planted slow component was found.\n`);
          ' "${{ steps.spectra.outputs.result-file }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-action
          path: ci-notes/
          if-no-files-found: ignore

  report:
    name: PR report
    if: always() && github.event_name == 'pull_request'
    needs: [lint, test, package, links, size, dependency-review, bench, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # to read the run's jobs, their annotations and their logs
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: ci-notes
          merge-multiple: true
      - name: Compose the report
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pr-report
          node scripts/ci/pr-report.mjs ci-notes > pr-report/comment.md
          cat pr-report/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report
          path: pr-report/
