name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: VS Code extension unit tests
        run: npm --prefix vscode test

  fix-bench:
    name: Fix harness test bench
    runs-on: ubuntu-latest
    env:
      PERF_CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: spectra fix decides every case correctly
        run: node bench/run.mjs

  action:
    name: Action on the demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Start the demo app
        run: |
          npm run demo > demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5188/ > /dev/null && exit 0; sleep 1; done
          cat demo.log; exit 1
      - name: Spectra (this repository's action)
        id: spectra
        uses: ./
        with:
          url: http://localhost:5188/
          cli: bin/spectra.js
          runs: '2'
          fail-on-budget: 'false'
          artifact-name: spectra-demo-reports
      - name: The deliberate problems are found
        run: |
          node -e '
            const r = require(process.argv[1]);
            const titles = r.findings.map(f => f.title);
            console.log(r.summary);
            if (!titles.some(t => /Row is slow to render/.test(t))) throw new Error("missing the Row finding: " + titles);
          ' "${{ steps.spectra.outputs.result-file }}"
