name: Security

# Known vulnerabilities in what Spectra installs:
# - npm audit on the runtime dependencies (no account needed)
# - on pull requests, GitHub's dependency review of added or changed packages
# It also runs every Monday, so new advisories show up for unchanged code.
# Snyk has its own workflow (snyk.yml), and Socket reviews pull requests
# through its GitHub app (socket.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (runtime dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Audit what users install
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const v = a.metadata?.vulnerabilities || {};
            const line = ["critical", "high", "moderate", "low"].map(s => `${s}: ${v[s] ?? 0}`).join(" · ");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### npm audit, runtime dependencies\n\n${line}\n`);
            console.log(line);
          '
          npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
