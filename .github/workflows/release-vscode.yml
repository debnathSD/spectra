name: Release the VS Code extension

# Publishes the VS Code extension when a tag like vscode-v0.2.0 is pushed: its
# tests run, the "release" environment waits for a maintainer to approve, then
# the .vsix goes to the VS Code Marketplace (VSCE_PAT secret) and Open VSX
# (OVSX_PAT secret, for Cursor, Windsurf and VSCodium), with a build
# attestation, and to a GitHub Release with the changelog's notes.
#
# To release: bump "version" in vscode/package.json, add a
# "## VS Code extension <version> (<date>)" section to CHANGELOG.md, commit, then
#   git tag vscode-v<version> && git push origin vscode-v<version>

on:
  push:
    tags: ['vscode-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish the extension
    if: github.repository == 'progen-labs/spectra'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=progen-labs.spectra-performance
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag matches vscode/package.json, and CHANGELOG.md has its notes
        id: version
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          inpkg=$(node -p "require('./vscode/package.json').version")
          if [ "$version" != "$inpkg" ]; then
            echo "::error title=Version mismatch::The tag is $GITHUB_REF_NAME but vscode/package.json says $inpkg."
            exit 1
          fi
          node scripts/release-notes.mjs "VS Code extension $version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: npm --prefix vscode test
      - name: The .vsix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd vscode
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies -o "$RUNNER_TEMP/spectra-performance-$VERSION.vsix"
      - name: Build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/*.vsix
      - name: VS Code Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice title=Marketplace skipped::Add the VSCE_PAT secret to publish there."; exit 0; fi
          npx --yes @vscode/vsce@4.0.0 publish --packagePath "$RUNNER_TEMP"/*.vsix -p "$VSCE_PAT"
      - name: Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice title=Open VSX skipped::Add the OVSX_PAT secret to publish there."; exit 0; fi
          npx --yes ovsx@1.3.0 publish "$RUNNER_TEMP"/*.vsix -p "$OVSX_PAT"
      - name: The GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "VS Code extension $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/*.vsix
