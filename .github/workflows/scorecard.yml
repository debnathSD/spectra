name: Scorecard

# OpenSSF Scorecard: how well the repository follows security practices
# (branch protection, pinned dependencies, token permissions, …). Results go
# to the Security tab and to the public Scorecard API behind the README badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard
