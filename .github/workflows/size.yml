name: Size

# What Spectra costs the people who install it: the npm package, the install
# with its dependencies, and the dashboard bundle, each against a budget
# (scripts/size-report.mjs; the dashboard's budgets are "size-limit" in
# package.json). The numbers are in each run's summary, and pull requests get
# a comment comparing them with main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  size:
    name: Package and bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Sizes against their budgets
        run: node scripts/size-report.mjs

  compare:
    name: Bundle size compared with main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
