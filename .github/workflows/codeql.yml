name: CodeQL

# GitHub's code scanning of Spectra's own JavaScript, for security problems
# such as injection or unsafe paths. Findings go to the Security tab, and on a
# pull request spectra-bot lists the result with the other checks.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - fixtures
              - video
              - dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
