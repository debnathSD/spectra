# Weekly dependency updates, grouped so they arrive as few pull requests. Each
# one runs the Checks workflow, and spectra-bot reports on it like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # these only work together
      react:
        patterns: [react, react-dom, '@vitejs/plugin-react']
      eslint:
        patterns: [eslint, '@eslint/*', 'eslint-plugin-*', globals]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 waits for eslint-plugin-react to support it
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
